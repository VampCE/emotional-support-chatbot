version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: chatbot-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: chatbot
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend-node
    container_name: chatbot-backend
    restart: always
    ports:
      - "5001:5000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: chatbot
      PORT: 5000
    command: ["/wait-for.sh", "db", "npm", "start"]   # DÜZELTİLDİ!

volumes:
  db_data:
