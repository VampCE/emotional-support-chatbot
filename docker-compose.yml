version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: chatbot-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: chatbot
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend-node
    container_name: chatbot-backend
    restart: always
    ports:
      - "5001:5000"
    depends_on:
      - db
      - flask-ai
    env_file:
      - ./backend-node/.env
    command: ["/wait-for.sh", "db", "npm", "start"]

  flask-ai:
    build: ./flask-ai
    container_name: chatbot-flask
    ports:
      - "5002:5000"
    env_file:
      - ./flask-ai/.env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    runtime: nvidia

  frontend:
    build: ./frontend
    container_name: chatbot-frontend
    ports:
      - "80:3000"
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:5001

volumes:
  db_data:
